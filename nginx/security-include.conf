# Подключить в server {} vhost studiowest.ru (панель хостинга / nginx).
# Пример: include /home/srv86525/htdocs/studiowest/studio-west/nginx/security-include.conf;

server_tokens off;

# Утечки конфигов
location ~* /(ht\.access|htaccess|\.env.*|composer\.(json|lock)|config\.inc\.php)$ {
    deny all;
    return 404;
}

# Вложения: не исполнять PHP / скрипты
location ^~ /assets/attach/ {
    location ~* \.(php|phtml|phar|cgi|pl)$ {
        deny all;
        return 404;
    }
    types { }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition "attachment" always;
}

# Security headers (дублируют PHP-плагин — ок)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
